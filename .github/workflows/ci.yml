name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  package:
    name: package (${{ matrix.artifact }})
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: linux
            command: ./scripts/package-linux.sh --native
          - os: windows-latest
            artifact: windows
            command: pwsh -File scripts/package-windows.ps1
          - os: macos-latest
            artifact: macos
            command: ./scripts/package-macos.sh
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: Cache appimagetool
        if: runner.os == 'Linux'
        uses: actions/cache@v6
        with:
          path: ~/.cache/terraria-content-extractor
          key: appimagetool-1.9.1
      - name: Build packages
        shell: bash
        run: ${{ matrix.command }}
      - uses: ./.github/actions/smoke-test
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
