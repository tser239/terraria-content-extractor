[package]
name = "terraria-content-extractor"
version = "0.1.1"
edition = "2024"
rust-version = "1.95"
description = "Extract Terraria's XNB/XWB assets into PNG, WAV and JSON"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
eframe = { version = "0.37", default-features = false, features = [
    "glow",
    "default_fonts",
    "clipboard",
    "x11",
    "wayland",
] }
image = { version = "0.25", default-features = false, features = ["png"] }
lzxd = "0.2"
rayon = "1"
rfd = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
texture2ddecoder = "0.1"
walkdir = "2"
winit = "0.30"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
strip = true
